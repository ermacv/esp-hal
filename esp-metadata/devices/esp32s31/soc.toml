# ESP32-S31 Device Metadata
#
# The initial port intentionally declares only the peripherals required for
# runtime, time, console and flash bring-up. Add capabilities only after they
# have been checked against the ESP32-S31 ESP-IDF definitions.

[device]
name   = "esp32s31"
arch   = "riscv"
target = "riscv32imafc-unknown-none-elf"
# Two symmetric high-performance RISC-V cores.
cores  = 2
trm    = "https://github.com/espressif/esp-idf/tree/e88643bc619dff3c21b51705113bb488c9bc0990/components/soc/esp32s31"

symbols = []

[device.interrupts]
support_status = "partial"
status_registers = 6
software_interrupt_count = 4
controller = { Riscv = { flavour = "clic", interrupts = 48, priority_levels = 8 } }

[device.soc]
cpu_has_branch_predictor = true
multi_core_enabled = true
cpu_has_csr_pc = false
internal_memory_cached = false

# ESP-IDF soc.h defines one 512 KiB unified internal SRAM window. The ROM RAM
# loader currently reserves the first 64 KiB during bring-up.
memory_map = { ranges = [
    { name = "dram", start = 0x2F01_0000, end = 0x2F08_0000 },
    { name = "dram2_uninit", start = 0x2F00_0000, end = 0x2F01_0000 },
] }

peripherals = [
    { name = "EFUSE", hidden = true },
    { name = "GPIO" },
    { name = "HP_SYSTEM", pac = "HP_SYS" },
    { name = "HP_SYS_CLKRST" },
    { name = "HP_APM" },
    { name = "HP_MEM_APM" },
    { name = "SYSTEM", pac = "HP_SYS" },
    { name = "CLIC" },
    { name = "CACHE" },
    { name = "CPU_APM" },
    { name = "IO_MUX" },
    { name = "IOMUX_MSPI_PIN" },
    { name = "LP_AON", pac = "LP_AON_CLKRST" },
    { name = "LP_AON_CLKRST" },
    { name = "LP_I2C_ANA_MST" },
    { name = "PMU" },
    { name = "RTC_TIMER", pac = "LP_TIMER" },
    { name = "LP_WDT" },
    { name = "LPWR", pac = "LP_AON_CLKRST" },
    { name = "RNG", pac = "TRNG" },
    { name = "AXI_GDMA", pac = "AXI_DMA" },
    { name = "AES", interrupts = { peri = "AES" } },
    { name = "HMAC" },
    { name = "SHA", interrupts = { peri = "SHA" } },
    # ECDSA verification uses the dedicated front-end plus the shared ECC
    # arithmetic engine. ECC remains hidden until its generic driver has been
    # qualified independently on S31.
    { name = "ECC", hidden = true },
    { name = "ECDSA", interrupts = { peri = "ECDSA" } },
    { name = "SYSTIMER" },
    { name = "TIMG0" },
    { name = "TIMG1" },
    { name = "UART0", interrupts = { peri = "UART0" } },
    { name = "UART1", interrupts = { peri = "UART1" } },
    { name = "UART2", interrupts = { peri = "UART2" } },
    { name = "UART3", interrupts = { peri = "UART3" } },
    { name = "SPI0" },
    { name = "PSRAM_MSPI" },
    { name = "PSRAM", virtual = true },
    { name = "SPI1" },
    { name = "SPI2", interrupts = { peri = "SPI2" } },
    { name = "USB_DEVICE", interrupts = { peri = "USB_DEVICE" } },
    { name = "FLASH", virtual = true },
    { name = "ETH", virtual = true },
    { name = "CPU_CTRL", virtual = true },
    { name = "SW_INTERRUPT", virtual = true },
    { name = "WIFI", virtual = true, interrupts = { bb = "WIFI_BB", mac = "WIFI_MAC", pwr = "WIFI_PWR" }, stable = true },
]

[device.soc.clocks]
# {include clocks.toml}

[device.systimer]

[device.psram]
extmem_origin = 0x5000_0000

# The USB Serial/JTAG register block matches the classic Espressif controller
# used by the other RISC-V parts.  ESP32-S31 adds timeout registers after the
# common register range, without changing any register consumed by the driver.
[device.usb_serial_jtag]

[device.gpio]
# ESP32-S31 uses the dual-core GPIO register layout (GPIO v3).  Peripheral
# signal mappings and native IO_MUX functions will be added separately; this
# initial table intentionally enables only generic GPIO operation.
version = 3
has_bank_1 = true
has_input_sync = true
support_status = "partial"
gpio_function = 1
constant_0_input = 0xC0
constant_1_input = 0x80
pins = [
    { pin =  0 }, { pin =  1 }, { pin =  2 }, { pin =  3 },
    { pin =  4 }, { pin =  5 }, { pin =  6 }, { pin =  7 },
    { pin =  8 }, { pin =  9 }, { pin = 10 }, { pin = 11 },
    { pin = 12 }, { pin = 13 }, { pin = 14 }, { pin = 15 },
    { pin = 16 }, { pin = 17 }, { pin = 18 }, { pin = 19 },
    { pin = 20 }, { pin = 21 }, { pin = 22 }, { pin = 23 },
    { pin = 24 }, { pin = 25 }, { pin = 26 }, { pin = 27 },
    { pin = 28 },
    # GPIO29 and GPIO41 are not bonded/valid according to SOC_GPIO_VALID_GPIO_MASK.
    { pin = 30 }, { pin = 31 }, { pin = 32 }, { pin = 33 },
    { pin = 34 }, { pin = 35 }, { pin = 36 }, { pin = 37 },
    { pin = 38 }, { pin = 39 }, { pin = 40 },
    { pin = 42 }, { pin = 43 }, { pin = 44 }, { pin = 45 },
    { pin = 46 }, { pin = 47 }, { pin = 48 }, { pin = 49 },
    { pin = 50 }, { pin = 51 }, { pin = 52 }, { pin = 53 },
    { pin = 54 }, { pin = 55 }, { pin = 56 }, { pin = 57 },
    { pin = 58 }, { pin = 59 }, { pin = 60 }, { pin = 61 },
]
input_signals = [
    { name = "U0RXD", id = 10 },
    { name = "EMAC_MDI", id = 107 },
]
output_signals = [
    { name = "U0TXD", id = 10 },
    { name = "EMAC_MDC", id = 108 },
    { name = "EMAC_MDO", id = 109 },
    { name = "GPIO",  id = 256 },
]

[device.sleep]
support_status = "not_supported"
wakeup_sources = { Timer = 13 }

[device.wifi]
support_status = "partial"
has_wifi6 = true
mac_version = 3
csi_supported = true

[device.phy]
support_status = "partial"

[device.rng]
support_status = "partial"
trng_supported = true
apb_cycle_wait_num = 16

[device.aes]
support_status = "partial"
has_split_text_registers = true
endianness_configurable = false
dma_mode = ["ECB", "CTR", "GCM"]
key_length = { options = [
    { bits = 128, encrypt_mode = 0, decrypt_mode = 4 },
    { bits = 256, encrypt_mode = 2, decrypt_mode = 6 },
] }

[device.hmac]
support_status = "partial"

[device.sha]
support_status = "partial"
algo = { sha1 = 0, sha224 = 1, sha256 = 2, sha384 = 3, sha512 = 4, sha512_224 = 5, sha512_256 = 6, sha512_t = 7 }

[device.ecdsa]
support_status = "partial"

[device.dma]
support_status = "partial"
gdma_version = 2
separate_in_out_interrupts = true
engines = [
    {
        name = "AXI_GDMA",
        max_priority = 5,
        burst_sizes = [8, 16, 32, 64, 128],
        drivers = ["aes", "sha"],
        peripheral_instances = [
            { name = "AES", dma_id = 4 },
            { name = "SHA", dma_id = 5 },
        ],
        channels = [
            { name = "DMA_AXI_CH0", mem2mem = true, mem2mem_id = 6, interrupt_in = "AXI_PDMA_IN_CH0", interrupt_out = "AXI_PDMA_OUT_CH0" },
            { name = "DMA_AXI_CH1", mem2mem = true, mem2mem_id = 7, interrupt_in = "AXI_PDMA_IN_CH1", interrupt_out = "AXI_PDMA_OUT_CH1" },
            { name = "DMA_AXI_CH2", mem2mem = true, mem2mem_id = 8, interrupt_in = "AXI_PDMA_IN_CH2", interrupt_out = "AXI_PDMA_OUT_CH2" },
        ]
    },
]
