system_clocks = { clock_tree = [
    { name = "XTAL_CLK", type = "source", values = "40", output = "VALUE * 1_000_000", always_on = true },
    { name = "CPU_CLK",  type = "source", values = "320", output = "VALUE * 1_000_000", always_on = true },
    { name = "APB_CLK",  type = "source", values = "80", output = "VALUE * 1_000_000", always_on = true },
] }

peripheral_clocks = { templates = [
    { name = "clk_en_template", value = "crate::peripherals::HP_SYS_CLKRST::regs().systimer_ctrl0().modify(|_, w| w.reg_systimer_apb_clk_en().bit(enable).reg_systimer_clk_en().bit(enable));" },
    { name = "rst_template", value = "crate::peripherals::HP_SYS_CLKRST::regs().systimer_ctrl0().modify(|_, w| w.reg_systimer_rst_en().bit(reset));" },
    # The crypto subsystem clock is shared, while SHA has its own leaf clock and
    # reset bits. Keep the shared clock enabled so dropping a SHA guard cannot
    # stop another crypto peripheral that will be added later.
    { name = "aes_clk_template", value = "crate::peripherals::HP_SYS_CLKRST::regs().crypto_ctrl0().modify(|_, w| w.reg_crypto_sys_clk_en().set_bit().reg_crypto_aes_clk_en().bit(enable));" },
    { name = "aes_rst_template", value = "crate::peripherals::HP_SYS_CLKRST::regs().crypto_ctrl0().modify(|_, w| w.reg_crypto_aes_rst_en().bit(reset).reg_crypto_rst_en().clear_bit().reg_crypto_ds_rst_en().clear_bit());" },
    { name = "sha_clk_template", value = "crate::peripherals::HP_SYS_CLKRST::regs().crypto_ctrl0().modify(|_, w| w.reg_crypto_sys_clk_en().set_bit().reg_crypto_sha_clk_en().bit(enable));" },
    { name = "sha_rst_template", value = "crate::peripherals::HP_SYS_CLKRST::regs().crypto_ctrl0().modify(|_, w| w.reg_crypto_sha_rst_en().bit(reset));" },
    { name = "ecc_clk_template", value = "crate::peripherals::HP_SYS_CLKRST::regs().crypto_ctrl0().modify(|_, w| w.reg_crypto_sys_clk_en().set_bit().reg_crypto_ecc_clk_en().bit(enable));" },
    { name = "ecc_rst_template", value = "crate::peripherals::HP_SYS_CLKRST::regs().crypto_ctrl0().modify(|_, w| w.reg_crypto_ecc_rst_en().bit(reset).reg_crypto_ecdsa_rst_en().clear_bit().reg_crypto_rst_en().clear_bit());" },
    { name = "ecdsa_clk_template", value = "crate::peripherals::HP_SYS_CLKRST::regs().crypto_ctrl0().modify(|_, w| w.reg_crypto_sys_clk_en().set_bit().reg_crypto_ecdsa_clk_en().bit(enable));" },
    { name = "ecdsa_rst_template", value = "crate::peripherals::HP_SYS_CLKRST::regs().crypto_ctrl0().modify(|_, w| w.reg_crypto_ecdsa_rst_en().bit(reset).reg_crypto_rst_en().clear_bit());" },
    { name = "axi_gdma_clk_template", value = "crate::peripherals::HP_SYS_CLKRST::regs().axi_pdma_ctrl0().modify(|_, w| w.reg_axi_pdma_sys_clk_en().bit(enable));" },
    { name = "axi_gdma_rst_template", value = "crate::peripherals::HP_SYS_CLKRST::regs().axi_pdma_ctrl0().modify(|_, w| w.reg_axi_pdma_rst_en().bit(reset));" },
], peripheral_clocks = [
    { name = "Systimer", keep_enabled = true },
    { name = "Aes", template_params = { clk_en_template = "{{aes_clk_template}}", rst_template = "{{aes_rst_template}}" } },
    { name = "Sha", template_params = { clk_en_template = "{{sha_clk_template}}", rst_template = "{{sha_rst_template}}" } },
    { name = "Ecc", template_params = { clk_en_template = "{{ecc_clk_template}}", rst_template = "{{ecc_rst_template}}" } },
    { name = "Ecdsa", template_params = { clk_en_template = "{{ecdsa_clk_template}}", rst_template = "{{ecdsa_rst_template}}" } },
    { name = "AxiGdma", template_params = { clk_en_template = "{{axi_gdma_clk_template}}", rst_template = "{{axi_gdma_rst_template}}" } },
    # USB Serial/JTAG is already enabled by the ROM. Like ESP32-P4, S31 has a
    # dedicated APB clock gate but no peripheral reset bit in HP_SYS_CLKRST.
    { name = "UsbDevice", template_params = { clk_en_template = "crate::peripherals::HP_SYS_CLKRST::regs().usb_device_ctrl0().modify(|_, w| w.reg_usb_device_apb_clk_en().bit(enable));", rst_template = "let _ = reset;" }, keep_enabled = true },
] }
